<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>คลังพัสดุและครุภัณฑ์</title><style>
:root{--blue:#1455d9;--bg:#f4f7fb;--text:#172033;--muted:#64748b;--red:#dc2626;--green:#078447}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial,sans-serif;color:var(--text)}header{background:linear-gradient(120deg,#103b9b,#2874e8);color:#fff;padding:24px max(18px,calc((100% - 1200px)/2));display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}header small{opacity:.8}.wrap{max-width:1200px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,.panel{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 15px #17203312}.card b{font-size:25px;display:block;margin-top:7px}.label{color:var(--muted);font-size:12px}.red{color:var(--red)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.panel h2{font-size:17px;margin:0 0 14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{border:0;border-radius:8px;background:var(--blue);color:white;padding:9px 14px;cursor:pointer}button.secondary{background:#e8eefc;color:#19449d}button.danger{background:#fee2e2;color:#a71919}input,select,textarea{border:1px solid #d4dbe8;border-radius:7px;padding:9px;background:#fff;min-width:0;width:100%}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px 7px;border-bottom:1px solid #edf0f5;text-align:left}th{color:var(--muted);background:#fafbfe}.tablewrap{overflow:auto;max-height:430px}.badge{background:#e8f7ef;color:var(--green);padding:3px 7px;border-radius:20px;font-size:11px}.badge.warn{background:#fff1db;color:#a15c00}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.dialog{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:12px;color:var(--muted)}.form label.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.bar{height:9px;background:#dce7ff;border-radius:10px;margin-top:6px}.bar i{display:block;height:100%;background:var(--blue);border-radius:10px}.empty{color:var(--muted);padding:18px;text-align:center}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wrap{padding:12px}header{padding:18px 12px}.form{grid-template-columns:1fr}.form label.full{grid-column:auto}}
</style></head><body><header><div><h1>📦 Office Inventory Dashboard</h1><small>ระบบแดชบอร์ดคลังพัสดุและครุภัณฑ์สำนักงาน</small></div><button onclick="load()">รีเฟรชข้อมูล</button></header><main class="wrap"><section class="cards"><div class="card"><span class="label">รายการพัสดุ</span><b id="items">-</b></div><div class="card"><span class="label">จำนวนคงเหลือรวม</span><b id="qty">-</b></div><div class="card"><span class="label">มูลค่าคงคลัง</span><b id="value">-</b></div><div class="card"><span class="label">ครุภัณฑ์</span><b id="assets">-</b></div><div class="card"><span class="label">ใกล้หมด</span><b class="red" id="low">-</b></div></section><div class="toolbar"><button onclick="openItem()">＋ เพิ่มพัสดุ</button><button class="secondary" onclick="document.getElementById('fileInput').click()">นำเข้าจากไฟล์ CSV</button><button class="secondary" onclick="importUrl()">นำเข้าจากลิงก์</button><input id="fileInput" type="file" accept=".csv,text/csv" style="display:none" onchange="importCsv(this.files[0])"><button class="secondary" onclick="openTxn()">↕ รับเข้า / เบิกออก</button><button class="secondary" onclick="openAsset()">＋ เพิ่มครุภัณฑ์</button><button class="secondary" onclick="setupNow()">ตั้งค่าระบบครั้งแรก</button></div><section class="grid"><div class="panel"><h2>รายการใกล้หมด</h2><div id="lowTable"></div></div><div class="panel"><h2>สรุปตามหมวดหมู่</h2><div id="categories"></div></div></section><section class="panel" style="margin-top:16px"><h2>คลังพัสดุ <input id="search" placeholder="ค้นหาชื่อ / รหัส / หมวดหมู่" oninput="renderInventory()" style="max-width:290px;float:right"></h2><div class="tablewrap" id="inventoryTable"></div></section><section class="panel" style="margin-top:16px"><h2>ทะเบียนครุภัณฑ์</h2><div class="tablewrap" id="assetTable"></div></section></main><div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div><script src="config.js?v=2"></script><script>
let D={inventory:[],assets:[],transactions:[]};const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const API=window.API_URL||'';function call(fn,arg){const data=arg===undefined?null:arg;const read=['getDashboard','getItemList','getNextItemCode','getNextAssetCode'].indexOf(fn)>=0;const p=read?apiGet(fn,data):apiPost(fn,data);return p.catch(e=>{alert(e.message||e);throw e})}function apiPost(fn,data){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:fn,data:data})}).then(r=>r.json()).then(j=>{if(!j.ok){const e=new Error(j.error||'เซิร์ฟเวอร์ขัดข้อง');e.biz=1;throw e}return j.result})}function apiGet(fn,data){const url=API+'?action='+encodeURIComponent(fn)+'&data='+encodeURIComponent(JSON.stringify(data));const one=()=>fetch(url).then(r=>r.json()).then(j=>{if(!j.ok){const e=new Error(j.error||'เซิร์ฟเวอร์ขัดข้อง');e.biz=1;throw e}return j.result});return one().catch(e=>{if(e&&e.biz)throw e;return jsonp(fn,data)})}function jsonp(fn,data){return new Promise((res,rej)=>{const cb='__apicb'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);const s=document.createElement('script');const clean=()=>{try{delete window[cb]}catch(_){window[cb]=undefined}s.remove()};window[cb]=j=>{clean();if(!j||!j.ok)rej(new Error(j&&j.error?j.error:'ข้อผิดพลาดจากเซิร์ฟเวอร์'));else res(j.result)};s.onerror=()=>{clean();rej(new Error('ติดต่อเซิร์ฟเวอร์ไม่ได้'))};s.src=API+'?callback='+cb+'&action='+encodeURIComponent(fn)+'&data='+encodeURIComponent(JSON.stringify(data));document.body.appendChild(s)})}function load(){call('getDashboard').then(d=>{D=d;render()})}function render(){const s=D.summary||{};$('items').textContent=s.items||0;$('qty').textContent=(s.quantity||0).toLocaleString();$('value').textContent=(s.value||0).toLocaleString(undefined,{maximumFractionDigits:2})+' ฿';$('assets').textContent=s.assets||0;$('low').textContent=s.low||0;renderInventory();renderAssets();$('lowTable').innerHTML=D.low?.length?'<table><tr><th>รายการ</th><th>เหลือ</th><th>ขั้นต่ำ</th></tr>'+D.low.map(x=>`<tr><td>${esc(x.Name)}</td><td class="red">${x.Quantity} ${esc(x.Unit)}</td><td>${x.MinStock}</td></tr>`).join('')+'</table>':'<div class="empty">ไม่มีรายการใกล้หมด</div>';let cs=D.categories||{},max=Math.max(1,...Object.values(cs));$('categories').innerHTML=Object.entries(cs).map(([k,v])=>`<div>${esc(k)} <b style="float:right">${v}</b><div class="bar"><i style="width:${v/max*100}%"></i></div></div>`).join('')||'<div class="empty">ยังไม่มีข้อมูล</div>'}function renderInventory(){let q=($('search').value||'').toLowerCase(),a=D.inventory.filter(x=>[x.Name,x.Code,x.Category].join(' ').toLowerCase().includes(q));$('inventoryTable').innerHTML=a.length?'<table><tr><th>รหัส</th><th>รายการ</th><th>หมวดหมู่</th><th>คงเหลือ</th><th>สถานที่</th><th></th></tr>'+a.map(x=>`<tr><td>${esc(x.Code)}</td><td><b>${esc(x.Name)}</b><br><span class="label">${esc(x.Type)}</span></td><td>${esc(x.Category)}</td><td>${x.Quantity} ${esc(x.Unit)} ${Number(x.Quantity)<=Number(x.MinStock)?'<span class="badge warn">ใกล้หมด</span>':''}</td><td>${esc(x.Location)}</td><td><button class="secondary" onclick='openItem(${JSON.stringify(x)})'>แก้ไข</button> <button class='danger' onclick="removeRecord('${x.ItemID||x.AssetID}')">ลบ</button></td></tr>`).join('')+'</table>':'<div class="empty">ไม่พบข้อมูล</div>'}function renderAssets(){$('assetTable').innerHTML=D.assets.length?'<table><tr><th>รหัสครุภัณฑ์</th><th>รายการ</th><th>หน่วยงาน</th><th>สถานที่</th><th>ผู้รับผิดชอบ</th><th>สถานะ</th><th></th></tr>'+D.assets.map(x=>`<tr><td>${esc(x.AssetCode)}</td><td>${esc(x.Name)}</td><td>${esc(x.Department)}</td><td>${esc(x.Location)}</td><td>${esc(x.Responsible)}</td><td><span class="badge">${esc(x.Status)}</span></td><td><button class="secondary" onclick='openAsset(${JSON.stringify(x)})'>แก้ไข</button> <button class='danger' onclick="removeRecord('${x.ItemID||x.AssetID}')">ลบ</button></td></tr>`).join('')+'</table>':'<div class="empty">ยังไม่มีข้อมูลครุภัณฑ์</div>'}
function removeRecord(id){if(!confirm('ยืนยันการลบรายการนี้?'))return;const fn=String(id).indexOf('IT')===0?'deleteItem':'deleteAsset';call(fn,id).then(d=>{D=d;render()})}function importUrl(){const url=prompt('วางลิงก์ CSV หรือ Google Sheet ที่แชร์เป็นผู้มีลิงก์ดูได้');if(!url)return;call('importItemsFromUrl',url).then(x=>{D=x.data;render();alert('นำเข้าแล้ว '+x.added+' รายการ และข้าม '+x.skipped+' รายการ')})}function importCsv(file){if(!file)return;const r=new FileReader();r.onload=e=>{call('importItemsFromText',e.target.result).then(x=>{D=x.data;render();alert('นำเข้าแล้ว '+x.added+' รายการ และข้าม '+x.skipped+' รายการ')})};r.readAsText(file,'UTF-8')}function openItem(x={}){ const code=x.Code||D.nextItemCode||'0001';$('modalTitle').textContent=x.ItemID?'แก้ไขพัสดุ':'เพิ่มพัสดุ';$('modalBody').innerHTML=`<div class="form"><label>รหัสพัสดุ/ครุภัณฑ์ (อัตโนมัติ 4 หลัก)<input id="fCode" value="${esc(code)}"></label><label>ชื่อรายการ<input id="fName" value="${esc(x.Name)}"></label><label>หมวดหมู่<input id="fCat" value="${esc(x.Category||'ทั่วไป')}"></label><label>หน่วยนับ<input id="fUnit" value="${esc(x.Unit||'ชิ้น')}"></label><label>จำนวนคงเหลือ<input id="fQty" type="number" value="${x.Quantity||0}"></label><label>จุดแจ้งเตือนขั้นต่ำ<input id="fMin" type="number" value="${x.MinStock||5}"></label><label>ราคาต่อหน่วย<input id="fPrice" type="number" value="${x.Price||0}"></label><label>สถานที่จัดเก็บ<input id="fLoc" value="${esc(x.Location)}"></label><label>ประเภท<select id="fType"><option value="พัสดุ" ${x.Type!=='ครุภัณฑ์'?'selected':''}>พัสดุ</option><option value="ครุภัณฑ์" ${x.Type==='ครุภัณฑ์'?'selected':''}>ครุภัณฑ์</option></select></label><label class="full">หมายเหตุ<textarea id="fNote">${esc(x.Notes)}</textarea></label></div><div class="actions"><button class="secondary" onclick="closeM()">ยกเลิก</button><button onclick="saveItem()">บันทึก</button></div>`;$('modal').classList.add('on');window.edit=x}function saveItem(){let x={ItemID:window.edit.ItemID,Code:$('fCode').value,Name:$('fName').value,Category:$('fCat').value,Unit:$('fUnit').value,Quantity:$('fQty').value,MinStock:$('fMin').value,Price:$('fPrice').value,Location:$('fLoc').value,Type:$('fType').value,Notes:$('fNote').value};call('saveItem',x).then(d=>{D=d;closeM();render()})}
function openTxn(){if(!D.inventory.length)return alert('กรุณาเพิ่มพัสดุก่อน');$('modalTitle').textContent='รับเข้า / เบิกออก';$('modalBody').innerHTML=`<div class="form"><label>รายการ<select id="tItem">${D.inventory.map(x=>`<option value="${x.ItemID}">${esc(x.Name)} (เหลือ ${x.Quantity})</option>`).join('')}</select></label><label>ประเภท<select id="tType"><option value="IN">รับเข้า</option><option value="OUT">เบิกออก</option><option value="ADJUST">ปรับยอดคงเหลือ</option></select></label><label>จำนวน<input id="tQty" type="number" min="1" value="1"></label><label>ผู้เบิก/ผู้รับผิดชอบ<input id="tReq"></label><label>หน่วยงาน<select id="tDept"><option value="">-- เลือกหน่วยงาน --</option><option value="งานกลยุทธ์ฯ">งานกลยุทธ์ฯ</option><option value="งานบริการฯ">งานบริการฯ</option><option value="งานพัฒนาฯ">งานพัฒนาฯ</option><option value="งานสวัสดิการฯ">งานสวัสดิการฯ</option></select></label><label>หมายเหตุ<input id="tNote"></label></div><div class="actions"><button class="secondary" onclick="closeM()">ยกเลิก</button><button onclick="saveTxn()">บันทึก</button></div>`;$('modal').classList.add('on')}function saveTxn(){call('recordTransaction',{ItemID:$('tItem').value,Type:$('tType').value,Quantity:$('tQty').value,Requester:$('tReq').value,Department:$('tDept').value,Note:$('tNote').value}).then(d=>{D=d;closeM();render()})}function openAsset(x={}){const code=x.AssetCode||D.nextAssetCode||'0001';$('modalTitle').textContent=x.AssetID?'แก้ไขครุภัณฑ์':'เพิ่มครุภัณฑ์';$('modalBody').innerHTML=`<div class="form"><label>รหัสครุภัณฑ์ (อัตโนมัติ 4 หลัก)<input id="aCode" value="${esc(code)}"></label><label>ชื่อครุภัณฑ์<input id="aName" value="${esc(x.Name)}"></label><label>หมวดหมู่<input id="aCat" value="${esc(x.Category||'ครุภัณฑ์สำนักงาน')}"></label><label>หน่วยงาน<select id="aDept"><option value="">-- เลือกหน่วยงาน --</option><option value="งานกลยุทธ์ฯ" ${x.Department==='งานกลยุทธ์ฯ'?'selected':''}>งานกลยุทธ์ฯ</option><option value="งานบริการฯ" ${x.Department==='งานบริการฯ'?'selected':''}>งานบริการฯ</option><option value="งานพัฒนาฯ" ${x.Department==='งานพัฒนาฯ'?'selected':''}>งานพัฒนาฯ</option><option value="งานสวัสดิการฯ" ${x.Department==='งานสวัสดิการฯ'?'selected':''}>งานสวัสดิการฯ</option></select></label><label>สถานที่ตั้ง<input id="aLoc" value="${esc(x.Location)}"></label><label>ผู้รับผิดชอบ<input id="aResp" value="${esc(x.Responsible)}"></label><label>สถานะ<select id="aStatus"><option>ใช้งาน</option><option>ชำรุด</option><option>จำหน่าย</option><option>ยืม</option></select></label><label>ราคาซื้อ<input id="aCost" type="number" value="${x.Cost||0}"></label><label class="full">หมายเหตุ<textarea id="aNote">${esc(x.Note)}</textarea></label></div><div class="actions"><button class="secondary" onclick="closeM()">ยกเลิก</button><button onclick="saveAsset()">บันทึก</button></div>`;$('modal').classList.add('on');window.editAsset=x}function saveAsset(){call('saveAsset',{AssetID:window.editAsset.AssetID,AssetCode:$('aCode').value,Name:$('aName').value,Category:$('aCat').value,Department:$('aDept').value,Location:$('aLoc').value,Responsible:$('aResp').value,Status:$('aStatus').value,Cost:$('aCost').value,Note:$('aNote').value}).then(d=>{D=d;closeM();render()})}function closeM(){$('modal').classList.remove('on')}function setupNow(){call('setup').then(()=>{alert('สร้างแท็บระบบเรียบร้อยแล้ว');load()})}load();</script></body></html>
