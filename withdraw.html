<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เบิกพัสดุสำนักงาน</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font:14px Arial,sans-serif;color:#172033}header{background:linear-gradient(120deg,#0b7c42,#22a05f);color:#fff;padding:20px;text-align:center}h1{font-size:22px;margin:0 0 4px}header small{opacity:.85}.wrap{max-width:560px;margin:16px auto;padding:0 12px 40px}.panel{background:#fff;border-radius:14px;padding:20px;box-shadow:0 3px 15px #17203312;margin-bottom:16px}h2.sec{font-size:15px;margin:0 0 10px;color:#0b7c42}label{display:block;font-size:12px;color:#64748b;margin:12px 0 4px}input,select{width:100%;border:1px solid #d4dbe8;border-radius:8px;padding:11px;font-size:15px;background:#fff}button{width:100%;border:0;border-radius:10px;background:#0b7c42;color:#fff;padding:13px;font-size:16px;cursor:pointer;margin-top:18px}button:disabled{background:#9db4a8;cursor:not-allowed}.row2{display:flex;gap:10px;align-items:flex-end}.row2>div{flex:1}.add{margin-top:0;background:#e8f7ef;color:#078447;border:1px solid #9fd8b7;font-size:14px;padding:12px}.add:active{background:#d4f0e2}.hint{font-size:12px;color:#64748b;margin-top:10px;text-align:center}.stock{float:right;color:#0b7c42;font-size:12px}.success{background:#e8f7ef;border:1px solid #9fd8b7;color:#078447;border-radius:10px;padding:12px;margin-bottom:14px;display:none;font-size:14px}.recent h2{font-size:15px;margin:0 0 10px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:8px 6px;border-bottom:1px solid #edf0f5;text-align:left;vertical-align:middle}th{color:#64748b;background:#fafbfe}.in{color:#078447}.out{color:#dc2626}.empty{color:#64748b;text-align:center;padding:14px;font-size:13px}#cart{margin-top:14px;border-top:1px dashed #d4dbe8;padding-top:6px}#cart table{margin-top:4px}input.qty{width:74px;padding:7px 8px;font-size:14px;display:inline-block}button.del{width:auto;background:#fee2e2;color:#dc2626;padding:7px 12px;font-size:12px;margin-top:0;border-radius:7px;font-weight:bold}.muted{color:#64748b;font-size:12px}.over{color:#dc2626;font-size:12px;font-weight:bold}.badge{display:inline-block;background:#0b7c42;color:#fff;border-radius:20px;padding:2px 9px;font-size:12px;margin-left:6px}.modal{position:fixed;inset:0;background:#0b122099;display:none;align-items:center;justify-content:center;padding:16px;z-index:60}.modal.open{display:flex}.mbox{background:#fff;border-radius:14px;width:100%;max-width:430px;max-height:88vh;overflow:auto;box-shadow:0 12px 40px #0005}.mhead{background:linear-gradient(120deg,#0b7c42,#22a05f);color:#fff;padding:14px 18px;font-size:17px;font-weight:bold;border-radius:14px 14px 0 0}.mbody{padding:14px 18px 4px}.mrow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0;border-bottom:1px dashed #e3e8f0}.mrow b{text-align:right}.mlabel{font-size:13px;color:#64748b;margin:12px 0 4px}table.mt{border-collapse:collapse;width:100%;font-size:13px}table.mt th{color:#64748b;background:#fafbfe;padding:7px 6px;text-align:left;border-bottom:1px solid #edf0f5}table.mt td{padding:7px 6px;border-bottom:1px solid #edf0f5;vertical-align:top}.ok-note{background:#e8f7ef;color:#078447;border-radius:8px;padding:10px;text-align:center;font-size:14px;margin:12px 0 4px;font-weight:bold}.mfoot{padding:10px 18px 18px}button.ghost{background:#0b7c42;margin-top:0}button.cancel{background:#eef2f7;color:#475569;margin-top:8px}.saving{opacity:.75}
</style></head><body><header><h1>📋 เบิกพัสดุสำนักงาน</h1><small>เลือกได้หลายรายการต่อครั้ง โดยไม่ต้องเข้าระบบคลัง</small></header><main class="wrap"><div class="panel"><div class="success" id="ok"></div><form id="f" onsubmit="return false"><h2 class="sec">1. เลือกรายการพัสดุที่จะเบิก</h2><label>ค้นหาพัสดุ</label><input id="q" placeholder="พิมพ์ชื่อหรือรหัสพัสดุ เพื่อกรองรายการ" oninput="fillItems()"><label>รายการพัสดุ <span class="stock" id="stockHint"></span></label><select id="item" onchange="showStock()"></select><div class="row2"><div><label>จำนวน</label><input id="qty" type="number" min="1" value="1" inputmode="numeric"></div><div><button id="addBtn" class="add" type="button" onclick="addItem()">＋ เพิ่มลงรายการเบิก</button></div></div><div id="cart"></div><h2 class="sec" style="margin-top:18px">2. ข้อมูลผู้เบิก</h2><label>ผู้เบิก / ผู้รับผิดชอบ</label><input id="req" placeholder="ชื่อ-สกุล"><label>หน่วยงาน</label><select id="dept"><option value="">-- เลือกหน่วยงาน --</option><option value="งานกลยุทธ์ฯ">งานกลยุทธ์ฯ</option><option value="งานบริการฯ">งานบริการฯ</option><option value="งานพัฒนาฯ">งานพัฒนาฯ</option><option value="งานสวัสดิการฯ">งานสวัสดิการฯ</option></select><label>หมายเหตุ (ถ้ามี)</label><input id="note"><button id="btn" type="button" onclick="window.openConfirm()" disabled>บันทึกรายการเบิก</button><div class="hint">บันทึกครั้งเดียว ระบบจะตัดสต็อกทุกรายการให้อัตโนมัติ</div></form></div><div class="panel recent"><h2>รายการล่าสุด</h2><div id="recent"><div class="empty">กำลังโหลด...</div></div></div></main><div class="modal" id="modal" onclick="if(event.target===this)window.closeModal()"><div class="mbox"><div class="mhead" id="mhead">🧾 ใบเบิกพัสดุ</div><div class="mbody" id="mbody"></div><div class="mfoot" id="mfoot"></div></div></div><script src="config.js?v=7"></script><script>
let items=[],txn=[],cart=[],busy=false;const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const API=window.API_URL||'';function call(fn,arg){const data=arg===undefined?null:arg;const read=['getDashboard','getItemList','getNextItemCode','getNextAssetCode'].indexOf(fn)>=0;const p=read?apiGet(fn,data):apiPost(fn,data);return p.catch(e=>{alert(e.message||e);throw e})}function apiPost(fn,data){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:fn,data:data})}).then(r=>r.json()).then(j=>{if(!j.ok){const e=new Error(j.error||'เซิร์ฟเวอร์ขัดข้อง');e.biz=1;throw e}return j.result})}function apiGet(fn,data){const url=API+'?action='+encodeURIComponent(fn)+'&data='+encodeURIComponent(JSON.stringify(data));const one=()=>fetch(url).then(r=>r.json()).then(j=>{if(!j.ok){const e=new Error(j.error||'เซิร์ฟเวอร์ขัดข้อง');e.biz=1;throw e}return j.result});return one().catch(e=>{if(e&&e.biz)throw e;return jsonp(fn,data)})}function jsonp(fn,data){return new Promise((res,rej)=>{const cb='__apicb'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);const s=document.createElement('script');const clean=()=>{try{delete window[cb]}catch(_){window[cb]=undefined}s.remove()};window[cb]=j=>{clean();if(!j||!j.ok)rej(new Error(j&&j.error?j.error:'ข้อผิดพลาดจากเซิร์ฟเวอร์'));else res(j.result)};s.onerror=()=>{clean();rej(new Error('ติดต่อเซิร์ฟเวอร์ไม่ได้'))};s.src=API+'?callback='+cb+'&action='+encodeURIComponent(fn)+'&data='+encodeURIComponent(JSON.stringify(data));document.body.appendChild(s)})}
function load(){call('getItemList').then(d=>{items=d.inventory||[];txn=d.transactions||[];fillItems();renderCart();renderRecent()})}
function fillItems(){const q=($('q').value||'').toLowerCase(),sel=$('item'),old=sel.value;const list=items.filter(x=>!q||[x.Name,x.Code].join(' ').toLowerCase().includes(q));sel.innerHTML=list.length?list.map(x=>`<option value="${x.ItemID}">${esc(x.Code)} · ${esc(x.Name)} (คงเหลือ ${x.Quantity} ${esc(x.Unit)})</option>`).join(''):'<option value="">ไม่พบรายการ</option>';if(old&&list.some(x=>x.ItemID===old))sel.value=old;showStock()}
function showStock(){const x=items.find(v=>v.ItemID===$('item').value);$('stockHint').textContent=x?`เหลือ ${x.Quantity} ${x.Unit}`:''}
function addItem(){if(busy)return alert('⏳ กำลังบันทึก กรุณารอสักครู่');const id=$('item').value,q=Number($('qty').value);if(!id)return alert('กรุณาเลือกรายการพัสดุ');if(!q||q<1)return alert('กรุณาระบุจำนวน');const x=items.find(v=>v.ItemID===id);if(!x)return alert('ไม่พบรายการนี้');const ex=cart.find(c=>c.ItemID===id);if(ex)ex.Quantity+=q;else cart.push({ItemID:id,Code:x.Code,Name:x.Name,Quantity:q,Unit:x.Unit,Stock:x.Quantity});$('qty').value=1;renderCart()}
function removeItem(id){cart=cart.filter(c=>c.ItemID!==id);renderCart()}
function setQty(id,v){const c=cart.find(x=>x.ItemID===id);if(!c)return;let n=Number(v);if(!n||n<1)n=1;c.Quantity=n;renderCart()}
function renderCart(){const el=$('cart');if(!cart.length){el.innerHTML='<div class="empty">ยังไม่มีรายการในใบเบิก — เลือกรายการด้านบนแล้วกด “＋ เพิ่มลงรายการเบิก” ได้หลายรายการ</div>'}else{el.innerHTML='<table><tr><th>รายการ</th><th>จำนวน</th><th></th></tr>'+cart.map(c=>{const over=c.Quantity>c.Stock;return `<tr><td>${esc(c.Code)} · ${esc(c.Name)}<br><small class="${over?'over':'muted'}">${over?'⚠ เกินคงเหลือ '+c.Stock+' '+esc(c.Unit):'คงเหลือ '+c.Stock+' '+esc(c.Unit)}</small></td><td><input class="qty" type="number" min="1" value="${c.Quantity}" onchange="setQty('${c.ItemID}',this.value)"> ${esc(c.Unit)}</td><td style="text-align:right"><button class="del" type="button" onclick="removeItem('${c.ItemID}')">ลบ</button></td></tr>`}).join('')+'</table>'}$('btn').textContent=cart.length?`บันทึกรายการเบิก (${cart.length} รายการ)`:'บันทึกรายการเบิก';$('btn').disabled=!cart.length}
function openConfirm(){if(busy)return;if(!cart.length)return alert('กรุณาเพิ่มรายการพัสดุก่อนบันทึก');if(!$('req').value.trim())return alert('กรุณาระบุชื่อผู้เบิก');if(!$('dept').value)return alert('กรุณาเลือกหน่วยงาน');$('mhead').textContent='📋 ยืนยันรายการเบิก';$('mbody').innerHTML='<div class="mlabel">กรุณาตรวจรายการด้านล่างให้ถูกต้อง ก่อนยืนยันการเบิก</div>'+cart.map(c=>`<div class="mrow"><span>${esc(c.Code)} · ${esc(c.Name)}</span><b>${c.Quantity} ${esc(c.Unit)}</b></div>`).join('')+`<div class="mrow"><span>ผู้เบิก</span><b>${esc($('req').value)}</b></div><div class="mrow"><span>หน่วยงาน</span><b>${esc($('dept').value)}</b></div>`+($('note').value?`<div class="mrow"><span>หมายเหตุ</span><b>${esc($('note').value)}</b></div>`:'')+'<div class="ok-note" style="background:#fff7e6;color:#b45309">ระบบจะตัดสต็อกทันทีที่กดยืนยัน</div>';$('mfoot').innerHTML='<button class="ghost" type="button" onclick="window.doSubmit()">✅ ยืนยันและบันทึกการเบิก</button><button class="cancel" type="button" onclick="window.closeModal()">← กลับไปแก้ไข</button>';$('modal').classList.add('open')}
function doSubmit(){if(busy)return;if(!cart.length)return alert('กรุณาเพิ่มรายการพัสดุก่อนบันทึก');busy=true;$('btn').disabled=true;$('btn').classList.add('saving');$('btn').textContent='⏳ กำลังบันทึก...';const info={req:$('req').value,dept:$('dept').value,note:$('note').value};call('recordWithdrawalBatch',{items:cart.map(c=>({ItemID:c.ItemID,Quantity:c.Quantity})),Requester:info.req,Department:info.dept,Note:info.note}).then(r=>{items=r.data.inventory;txn=r.data.transactions;cart=[];fillItems();renderCart();renderRecent();showReceipt(r,info);$('ok').style.display='block';$('ok').textContent=`✅ บันทึกแล้ว ${r.count} รายการ ตัดสต็อกเรียบร้อย`;$('note').value='';setTimeout(()=>$('ok').style.display='none',5000)}).finally(()=>{busy=false;$('btn').classList.remove('saving');$('btn').textContent=cart.length?`บันทึกรายการเบิก (${cart.length} รายการ)`:'บันทึกรายการเบิก';$('btn').disabled=!cart.length})}
function showReceipt(r,info){const d=new Date();$('mhead').textContent='🧾 ใบเบิกพัสดุ';$('mbody').innerHTML=`<div class="mrow"><span>วันที่เวลา</span><b>${d.toLocaleString('th-TH')}</b></div><div class="mrow"><span>ผู้เบิก</span><b>${esc(info.req||'-')}</b></div><div class="mrow"><span>หน่วยงาน</span><b>${esc(info.dept||'-')}</b></div>${info.note?`<div class="mrow"><span>หมายเหตุ</span><b>${esc(info.note)}</b></div>`:''}<div class="mlabel">รายการที่เบิก ${r.count} รายการ</div><table class="mt"><tr><th>รายการ</th><th>เบิกออก</th><th>คงเหลือใหม่</th></tr>${(r.receipt||[]).map(x=>`<tr><td>${esc(x.Code)} · ${esc(x.Name)}</td><td class="out">−${x.Quantity} ${esc(x.Unit)}</td><td><b>${x.Remaining} ${esc(x.Unit)}</b></td></tr>`).join('')}</table><div class="ok-note">✅ ตัดสต็อกเรียบร้อยแล้ว</div>`;$('mfoot').innerHTML='<button class="ghost" type="button" onclick="window.closeModal()">ตกลง</button>';$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open')}
function renderRecent(){$('recent').innerHTML=txn.length?'<table><tr><th>วันที่</th><th>รายการ</th><th>จำนวน</th><th>ผู้เบิก</th><th>หน่วยงาน</th></tr>'+txn.slice(0,15).map(x=>{const d=x.Date?new Date(x.Date):null;const ds=d&&!isNaN(d)?d.toLocaleDateString('th-TH',{day:'numeric',month:'short'}):'';return `<tr><td>${ds}</td><td>${esc(x.Name)}</td><td class="${x.Type==='OUT'?'out':'in'}">${x.Type==='OUT'?'−':'+'}${x.Quantity} ${esc(x.Unit)}</td><td>${esc(x.Requester)}</td><td>${esc(x.Department)}</td></tr>`}).join('')+'</table>':'<div class="empty">ยังไม่มีรายการ</div>'}
load();</script></body></html>
